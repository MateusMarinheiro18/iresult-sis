name: Deploy to Production (root via SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (actions runner)
        uses: actions/checkout@v4

      - name: Setup SSH agent
        # ALTEREI AQUI para uma tag estável disponível
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH as ${{ secrets.SERVER_USER }}
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Entrando em ${{ secrets.DEPLOY_PATH }}"
            cd ${{ secrets.DEPLOY_PATH }}

            BRANCH="${{ secrets.BRANCH }}"
            if [ -z "$BRANCH" ]; then
              BRANCH="main"
            fi

            echo "Garantindo branch $BRANCH"
            git fetch --all
            git reset --hard origin/$BRANCH

            echo "Instalando dependências (npm ci)..."
            npm ci

            echo "Buildando aplicação..."
            npm run build

            echo "Reiniciando PM2 (fallback se não existir)..."
            pm2 restart sis-frontend || pm2 start npm --name "sis-frontend" -- start -- -p 3001 -H 0.0.0.0

            echo "Deploy finalizado."
