name: Deploy (git pull + build + pm2)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (apenas para logs)
        uses: actions/checkout@v4

      # ==========================
      # PRODUÇÃO
      # ==========================
      - name: Deploy PROD
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all
            git reset --hard origin/${{ secrets.BRANCH }}
            npm ci
            npm run build
            pm2 describe sis-frontend > /dev/null 2>&1 \
              && pm2 restart sis-frontend --update-env \
              || pm2 start npm --name "sis-frontend" -- start -- -p 3001 -H 0.0.0.0

      # ==========================
      # HOMOLOGAÇÃO
      # ==========================
      - name: Deploy HML
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH_HML }}"
            git fetch --all
            git reset --hard origin/${{ secrets.BRANCH }}
            npm ci
            npm run build
            pm2 describe sis-frontend-hml > /dev/null 2>&1 \
              && pm2 restart sis-frontend-hml --update-env \
              || pm2 start npm --name "sis-frontend-hml" -- start -- -p 3002 -H 0.0.0.0
