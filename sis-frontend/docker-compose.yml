version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: sis_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sis_db
      MYSQL_USER: sis_user
      MYSQL_PASSWORD: sis_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: sis_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  mysql_data:
